# The web app and, behind it at /api, the API: one origin, so the browser needs no CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css image/svg+xml model/gltf-binary;

    location /api/ {
        # Resolved per request through Docker's DNS, so a restarted API is found at its new address
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Vite names every asset by its content hash, so they never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a page of the app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
