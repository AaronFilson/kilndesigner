[project]
name = "kilndesigner-cli"
version = "0.1.0"
description = "The kilndesigner command: build, check and export kiln designs from YAML files."
license = "MIT"
authors = [{ name = "Aaron Filson" }]
requires-python = ">=3.14"
dependencies = ["kilndesigner", "typer>=0.20"]

[project.scripts]
kilndesigner = "kilndesigner_cli.main:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
