# HarbisonWalker, Handbook of Refractory Practice (2005) [HW05], ring and arch combination tables
# (IR-25 to IR-62, PDF pages 149-185). The data for future tests; the reading and the comparisons are in
# hwi-ring-arch-tables.md.
#
# Transcribed 2026-11-17. Method: the page's text layer was rebuilt by word position (PyMuPDF), because its
# reading order is unreliable on these pages, then checked: every row's counts sum to its printed total, every
# table's rows run in order, every arch row's rise and inside radius were checked against the circle geometry
# (UR-28 formulas), and every page was looked at as a rendered image (half-page crops at 125-200 dpi);
# the flagged rows were read cell by cell on the image. The book and its page images are not in the repo.
#
# Each ring and arch table is cut at a 12 ft diameter or span; where the page runs on, 'printed_range' says so.
# 'counts' list only the shapes printed with a number: a column printed as a dash is left out.
# 'status' marks: Verified = read on the image; Read = text layer only; Derived = our arithmetic.
source: "HarbisonWalker, Handbook of Refractory Practice (2005) [HW05]"
transcribed: "2026-11-17"
rounding: "fractional parts of 0.1 brick or more counted as a whole brick (IR-25 and IR-52, PDF 149 and 175); no allowance for mortar, joints or size deviations"

