# The same kiln as pnw-hybrid-crossdraft.yaml, loaded on a car through the right-hand wall
# instead of a bricked door. Compare them with:
#   kilndesigner compare examples/pnw-hybrid-crossdraft.yaml examples/pnw-hybrid-crossdraft-car.yaml
# No sourced prices exist for car hardware; put your own estimate in car_hardware_cost.
schema: 1
name: PNW hybrid cross-draft, cone 10, car
units: us
firing:
  cone: "10"
  ware: 328 lb # an ESTIMATE of the shelves only, as in pnw-hybrid-crossdraft.yaml
chamber:
  width: 28 in
  depth: 60 in
  height: 44 in
roof:
  type: sprung_arch
  rise: 3.75 in
loading:
  type: car
  face: front # an end wall: the arch springs from the sides
lining:
  walls:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: ifb-k23
      thickness: 2.5 in
    - material: kaowool-blanket-8pcf
      thickness: 1 in
  floor:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: ifb-k23
      thickness: 2.5 in
  roof:
    - material: kast-o-lite-30-li-plus
      thickness: 3 in
    - material: kaowool-blanket-8pcf
      thickness: 2 in
shell:
  finish: painted
heat:
  electric:
    supply:
      voltage: 240 V
      phase: 1
      breaker: 60 A
    alloy: kanthal-apm
    walls: [left]
    off_above: 1650 degF # the start of shino reduction, cone 012–010 (cones.yaml)
  gas:
    burners:
      type: venturi
      count: 8 # the author's: slow flame movement at high volume
      wall: right # not on the car, which rolls out the front
    supply:
      type: cylinders
      count: 11 # meets the burners' draw at 20 °F even ¼ full keeping 10 psi
    reduction: true
draft:
  type: cross
  flue_wall: back
site:
  ambient: 50 degF
  coldest_ambient: 20 degF
  electricity_price: 0.12 USD/kWh
  propane_price: 3.50 USD/gallon
  materials_budget: 5000 USD
