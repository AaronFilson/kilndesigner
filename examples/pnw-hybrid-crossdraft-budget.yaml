# A budget variant of pnw-hybrid-crossdraft.yaml: the K-23 backup brick and the 1 in blanket
# become 3½ in of 6 pcf ceramic fibre blanket behind the hot-face brick (the wall stays 8 in), the
# burners are sized for a slow firing. Door, burners and cylinders as in the bricked-door design.
schema: 1
name: PNW hybrid cross-draft, cone 10, budget lining
units: us
firing:
  cone: "10"
  setting: # as in pnw-hybrid-crossdraft.yaml: four layers (an ASSUMPTION) of four mullite
    # shelves, no posts (unsourced), the ware 7 times the setting (the author's 6 to 8)
    shelves: {length: 24 in, width: 12 in, thickness: 1 in, material: mullite, per_layer: 4, layers: 4}
    ware_ratio: 7
chamber:
  width: 28 in
  depth: 60 in
  height: 44 in
roof:
  type: sprung_arch
  rise: 3.75 in
loading:
  type: door
  face: front # an end wall: the arch springs from the sides
  opening: {width: 24 in, height: 40 in, sill: 0 in, head: arch} # the author's door
lining:
  walls:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: kaowool-blanket-6pcf
      thickness: 3.5 in
  floor:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: ifb-k23
      thickness: 2.5 in
  roof:
    - material: kast-o-lite-30-li-plus
      thickness: 3 in
    - material: kaowool-blanket-8pcf
      thickness: 2 in
shell:
  finish: painted
heat:
  electric:
    supply:
      voltage: 240 V
      phase: 1
      breaker: 60 A
    alloy: kanthal-apm
    walls: [left]
    off_above: 1650 degF # the start of shino reduction, cone 012–010 (cones.yaml)
  gas:
    burners:
      type: venturi
      count: 8 # the author's, through the door as in pnw-hybrid-crossdraft.yaml
      wall: front
      places: # two columns of four up the sides of the 24 in door, every three courses from one
        # course up (Pitelka [S4]); each 4¼ in port 0.9 in in from its jamb and 3 in under the head
        - {wall: front, across: -9 in, up: 4.625 in}
        - {wall: front, across: -9 in, up: 12.125 in}
        - {wall: front, across: -9 in, up: 19.625 in}
        - {wall: front, across: -9 in, up: 27.125 in}
        - {wall: front, across: 9 in, up: 4.625 in}
        - {wall: front, across: 9 in, up: 12.125 in}
        - {wall: front, across: 9 in, up: 19.625 in}
        - {wall: front, across: 9 in, up: 27.125 in}
    supply: # the author's choice: more 100 lb cylinders, not a tank
      type: cylinders
      count: 11
    reduction: true
    firing_speed: slow
draft:
  type: cross
  flue_wall: back
site:
  ambient: 50 degF
  coldest_ambient: 20 degF
  electricity_price: 0.12 USD/kWh
  propane_price: 3.50 USD/gallon
  materials_budget: 5000 USD
