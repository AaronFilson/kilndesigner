# Fireworks kiln, Edmonton, Alberta, 1998 (Olsen, The Kiln Book, 4th ed., p.178–181, p.183, Figs
# 7-1 to 7-7): Olsen's first multi-directional wood kiln, built by 40 workshop participants. Two
# cross-draft systems at right angles, an anagama-style tube and a groundhog, share one fire zone;
# each firebox faces its own chimney across the zone and is also a door.
#
# From the book: the two tubes crossing at right angles, their vaults meeting in a groin over the
# fire zone (Fig 7-1); the fire zone "approximately 9ft (274cm) in both directions" (p.183); cone
# 10-plus (p.181), cone 10 used; a single tall chimney and a three-flue groundhog chimney; the roof
# covered in stones or shards (Fig 7-7). From Olsen's drawing of these kilns' firebox (Fig 7-3,
# p.179): a grate, 3–4 ft long, 3½ ft used; an ash pit 18 in deep and 14 in wide.
# The designer's (the user, 2026-10-31): Fig 7-1 is a concept, not a built kiln, and prints no
# arch heights; the anagama's vault about 5 ft high and the groundhog's about 6 ft, the user's
# starting heights, used: crowns at 60 and 72 in. p.183 prints the fire zone 3½–4½ ft to the
# ceiling's vertex, lower than these: the user's heights are taken over it.
# Assumed: each tube spans the fire zone, 9 ft, and is as long as the other is wide, with no arms
# past the crossing (none is printed): the plan the 9 × 9 ft fire zone, the fireboxes and chimneys
# at the tubes' ends. Walls 36 in to the springline, both vaults springing from them: so the
# groundhog's vault rises 36 in, 4 in per foot of span, the low end of Olsen's 4–6 in/ft on chamber
# kilns (p.296), and its 6 in ring holds a line of thrust 2.7 times the thinnest (Heyman's factor of
# 2 met); from the Church kiln's printed 28–30 in walls (Fig 7-9) it would rise 43 in and its ring
# be only 1.7 times the thinnest, too thin. The anagama's vault rises 24 in (2.7 in/ft, above
# Olsen's 1½ in/ft least, p.51). The fireboxes' widths from the Church kiln: 36 in for the anagama firebox, 24 in for the
# groundhog's (p.182); grates the ash pit's 14 in wide and the firebox's length, their bars ¾ in
# apart, as on his Kanayama kiln (p.188). Walls and floor 9 in of K-26 insulating brick: the walls
# of Olsen's multi-directional kilns are 9 in (church-skaelskor, Fig 7-9; kanayama-multi, p.186).
# The vaults cast 6 in thick in Kast-O-Lite 26 LI Plus: the book's Fireworks roof is cast (p.181,
# a "dome" over the crossing), he casts in insulating castable (p.51, p.58), "a 6in. thickness is
# best" (p.59), and his Kanayama roof is 5–6 in (p.186–188). Buttressed: Olsen buttresses a cast
# roof's walls "extremely well" (p.59), with dirt, rocks and concrete on his Kanayama kiln (p.186).
# The floor is on the ground: the walk-in ash pit 18 in deep below the grate (Fig 7-3), the Church
# kiln's channels "below ground" (Fig 7-9), the Kanayama kiln's fireboxes dug down (p.183–185).
# Chimneys: not sized in the book, so the engine sizes the one it models.
# Not modelled: Fig 7-2's walls curving in between the arms (the plan here is the two straight
# tubes); the groundhog's three-flue chimney in the right wall; the 12–15 in step up from the grate
# to the ware floor; the floor's loss into the ground, which the engine doesn't work out.
schema: 1
name: Fireworks multi-directional kiln, Edmonton
units: us
firing:
  cone: "10"
chamber:
  width: 9 ft # the anagama's tube, front to back, across the fire zone
  depth: 9 ft
  height: 36 in # to both vaults' springline
  on_ground: true # fireboxes dug down, ash pits walked into (Fig 7-3)
roof:
  type: sprung_arch
  rise: 24 in # the anagama's vault, its crown 5 ft up (the user)
  buttressed: true
  crossing: # the groundhog's tube, side to side (Fig 7-1)
    span: 9 ft
    rise: 36 in # its crown 6 ft up (the user)
    length: 9 ft
loading:
  type: door
  face: front
  door: bricked
lining:
  walls:
    - material: ifb-k26
      thickness: 9 in
  roof:
    - material: kast-o-lite-26-li-plus
      thickness: 6 in
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1 # the anagama firebox, the larger
        position: front
        width: 36 in
        length: 42 in
        grate:
          width: 14 in
          length: 42 in
          gap: 0.75 in
        ash_pit: 18 in
      - count: 1 # the groundhog firebox
        position: left
        width: 24 in
        length: 42 in
        grate:
          width: 14 in
          length: 42 in
          gap: 0.75 in
        ash_pit: 18 in
draft:
  type: cross
  flue_wall: back
