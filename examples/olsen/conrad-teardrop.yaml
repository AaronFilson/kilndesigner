# Conrad Calimpong's teardrop kiln (Olsen, The Kiln Book, 4th ed., p.116, p.124–125, Figs 4-140 to
# 4-147): a small wood-fired cross-draft with a teardrop plan under a cast dome, a front firebox on
# a grate, a side door and a 9 × 9 in chimney at the back.
#
# From the book (Fig 4-140, "all dimensions are interior measurements"): 9 ft 9 in long inside;
# widths 39 in at the front, 51½ in (faint) at the widest, 48 in 33 in further back, then 16 in
# (faint), 12 in a foot further on, and 19 in to the end; 35½ in (faint) high at the front and 35 in
# high 24 in from the back wall, taken as the walls' height under the dome; side door 37 in high ×
# 33 in wide; grate 15 in wide; ash pit 12 in deep and 24 in long. Chimney "only 9 x 9in.", which
# fires well (p.124). Double side walls (caption 4-144); buttressed with stones and concrete
# (4-145); a cast dome, first cast too thin and thickened (4-146).
# Assumed: the grate 24 in long, over the ash pit, and the firebox the front's 39 in by that 24 in.
# Walls and floor 9 in of K-26 insulating brick: the double walls as two 4½ in courses, in the
# 2500–2600 °F brick Olsen sets under a cast dome (p.58). The dome 6 in of Kast-O-Lite 26 LI Plus:
# Olsen casts domes in insulating castable (p.51, p.58: "Kast-O-Lite 2600 LI Plus"), and "a 6in.
# thickness is best" (p.59). Its rise, 2¾ in per foot of the 36 in span, 8¼ in: the middle of his
# 2½–3 in/ft for domes (p.51). Cone 10, from the Gulgong racer, Olsen's cast-dome wood cross-draft
# (gulgong-racer, p.119). The door in the right wall: the book doesn't say which side. Its 37 in
# reaches 2 in above the 35 in walls, into the dome's sides, which the sail dome allows. Its head
# is drawn with rounded corners and a flatter top than a semicircle, and what spans it isn't
# printed: it is taken as arched in the dome's 6 in ring, as Olsen's other built doors are
# (door-openings.md).
# Not modelled: the teardrop, as a box of its mean width, 36 in: widths 39, 51½, 48, 16 and 12 in
# at 0, 36, 69, 86 and 98 in from the front, averaged along the 117 in with 12 in carried to the
# end. The widest is placed at the side door's near jamb, which puts the 48 in at its far jamb;
# the plan doesn't fix it. The chimney's height isn't printed, so the chimney isn't entered: the
# engine sizes it (its section comes out 9 × 9 in). The exit opening (12 in high, its width not
# printed), the 9 in high stoke hole and the 2½ × 4 in passive damper.
schema: 1
name: Conrad Calimpong's teardrop kiln
units: us
firing:
  cone: "10"
chamber:
  width: 36 in # the teardrop's mean width
  depth: 117 in # 9 ft 9 in
  height: 35 in # to the dome's springline
roof:
  type: dome
  rise: 8.25 in
  buttressed: true
loading:
  type: door
  face: right
  door: bricked
  opening:
    width: 33 in # "KILN DOOR" 33 in (Fig 4-140)
    height: 37 in # 37 in (Fig 4-140), from the floor
    across: -6 in # its far jamb 48 in from the back wall (Fig 4-140): from 36 to 69 in of 117
lining:
  walls:
    - material: ifb-k26
      thickness: 9 in
  roof:
    - material: kast-o-lite-26-li-plus
      thickness: 6 in
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1
        position: front
        width: 39 in
        length: 24 in
        grate:
          width: 15 in
          length: 24 in
        ash_pit: 12 in
draft:
  type: cross
  flue_wall: back
