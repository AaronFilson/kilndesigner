# Mansimran Singh's round coal downdraft, Delhi Blue Pottery, New Delhi (Olsen, The Kiln Book,
# 4th ed., p.133–135, p.207): a domed round kiln with four coal fireboxes, fired to cone 10 in 19
# to 20 hours.
#
# From the book: chamber 7 ft across (Fig 5-10, a 38 ft² floor, p.207); 5 ft from the floor to
# the springline and a 2 ft dome rise (Fig 5-11); floor 9 in thick (Fig 5-11); four arched
# fireboxes, each 24 in wide inside (Fig 5-11) with a 24 × 24 in grate, 4 ft² (p.207, Fig 8-18),
# opening into the chamber through a 15 × 24 in firebox flue (p.134); twelve 6 × 6 in floor exit
# flues into a 24 × 16 in flue channel to the chimney (the flue port here), the chimney 24 × 24 in
# inside (Fig 5-10); coal; cone 10 (p.133).
# Assumed: the walls are 18 in, the least of the 18–22 in that carried the domes of early domed
# and downdraft kilns (p.45). The wall is notched 9 in deep at each firebox (p.134), so it is
# thicker than 9 in. The brick isn't named: dense brick, as in those load-bearing walls;
# medium-duty firebrick (Olsen's intermediate duty, p.18). The dome is 9 in
# thick, the thickest of Olsen's usual arch thicknesses (4½, 6¾ and 9 in, p.296). The floor is
# built on the ground (on_ground): it stands on a flue collection channel 12 in deep (Fig 5-11),
# not on a stand. Each firebox's length is taken as its grate's 24 in. The chimney is 30 ft tall,
# about 25–30 ft from the chamber (Fig 5-10, read by the user, 2026-10-31): the run is taken as
# 27½ ft, the middle. Stoking holes 15 × 13 in (Fig 5-11, read by the user, 2026-10-31). Each
# firebox 30 in tall above the grate and a 36 in ash pit (drawing, Fig 5-11, ?): the section prints
# 15", 15" and 36" up the firebox's side without saying which band is which; the two 15 in bands
# are read as above the grate, the 36 in as the "AIR SOURCE AND COAL ASH PIT 36" X 24"". The door
# and the air: engine defaults (a bricked door, 70 °F).
# Not modelled (see docs/kilns/olsen/singh-coal.md): the fireboxes stand on the diagonals, the
# arched door between two of them (Fig 5-10); the engine puts one on each of its four faces and
# makes the front wall the door. The twelve floor exit flues are spread in an even grid (their
# places aren't printed); the
# cooling and vapour holes in the dome (Fig 5-11); the damper in the chimney entrance (Fig 5-10). The 12 in deep flue channel under the floor, and the
# floor's loss into it and the ground. The printed "385 cu. ft (11cu. m)" (p.133, the 385 read by
# the user) doesn't fit the drawn sizes, which give about 235 ft³ (derived); the drawing is used.
schema: 1
name: Singh's round coal downdraft, Delhi Blue Pottery
units: us
firing:
  cone: "10"
chamber:
  shape: round
  width: 84 in
  depth: 84 in
  height: 60 in # floor to springline (Fig 5-11)
  on_ground: true # over a flue collection channel 12 in deep (Fig 5-11)
roof:
  type: dome
  rise: 24 in
lining:
  walls:
    - material: firebrick-medium-duty-smithfield
      thickness: 18 in
  floor:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in
  roof:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in
heat:
  fire:
    fuel: coal
    fireboxes:
      - position: left
        width: 24 in
        length: 24 in
        height: 30 in # above the grate: 15 + 15 in (drawing, Fig 5-11, ?)
        ash_pit: 36 in # the "AIR SOURCE AND COAL ASH PIT 36" X 24"" (drawing, Fig 5-11, ?)
        grate:
          width: 24 in
          length: 24 in
        inlet:
          width: 24 in
          height: 15 in
        stoke_hole: # "STOKING HOLE 15" X 13"" (Fig 5-11)
          width: 15 in
          height: 13 in
      - position: right
        width: 24 in
        length: 24 in
        height: 30 in # above the grate: 15 + 15 in (drawing, Fig 5-11, ?)
        ash_pit: 36 in # the "AIR SOURCE AND COAL ASH PIT 36" X 24"" (drawing, Fig 5-11, ?)
        grate:
          width: 24 in
          length: 24 in
        inlet:
          width: 24 in
          height: 15 in
        stoke_hole: # "STOKING HOLE 15" X 13"" (Fig 5-11)
          width: 15 in
          height: 13 in
      - position: back
        width: 24 in
        length: 24 in
        height: 30 in # above the grate: 15 + 15 in (drawing, Fig 5-11, ?)
        ash_pit: 36 in # the "AIR SOURCE AND COAL ASH PIT 36" X 24"" (drawing, Fig 5-11, ?)
        grate:
          width: 24 in
          length: 24 in
        inlet:
          width: 24 in
          height: 15 in
        stoke_hole: # "STOKING HOLE 15" X 13"" (Fig 5-11)
          width: 15 in
          height: 13 in
      - position: front
        width: 24 in
        length: 24 in
        height: 30 in # above the grate: 15 + 15 in (drawing, Fig 5-11, ?)
        ash_pit: 36 in # the "AIR SOURCE AND COAL ASH PIT 36" X 24"" (drawing, Fig 5-11, ?)
        grate:
          width: 24 in
          length: 24 in
        inlet:
          width: 24 in
          height: 15 in
        stoke_hole: # "STOKING HOLE 15" X 13"" (Fig 5-11)
          width: 15 in
          height: 13 in
draft:
  type: down
  flue_wall: back
  exits: # twelve 6" × 6" floor exit flues, evenly spaced (Fig 5-10)
    - through: floor
      count: 12
      port:
        width: 6 in
        height: 6 in
  connection: # the 24" × 16" flue channel to the chimney (Fig 5-10)
    width: 24 in
    height: 16 in
  run_to_chimney: 27.5 ft # "Approximately 25–30'" away (Fig 5-10)
  chimney:
    height: 30 ft # Fig 5-10, read by the user, 2026-10-31
    inside:
      width: 24 in
      depth: 24 in
