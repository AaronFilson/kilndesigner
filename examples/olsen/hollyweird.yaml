# Olsen's Hollyweird Tube (Olsen, The Kiln Book, 4th ed., p.116–117, p.124, Figs 4-108 to 4-115):
# a two-chamber wood kiln of the anagama type, built in 1985 at Olsen's home pottery: a Bizen-style
# front chamber joined to a tube-style second chamber, each under a dome cast in insulating
# castable, with a front firebox and a second, side-stoked firebox between the chambers. Fired
# about twice a year for 25 years, over 1500 hours at top temperature (p.117).
#
# From the book: held at cone 11-plus, 35–40 h in the front chamber and 10–15 h in the back, in a
# 60 h firing (p.117): cone 11 used. Hard firebrick for the walls (faint), flues and firebox;
# insulating brick for the transition to "Thermal Ceramics K-26 IFB castable", cast as the two
# dome-shaped chamber ceilings (p.116), which after 25 years had held up better than expected while
# the hard brick slagged at the flues (p.117). Chambers 8 ft and 12 ft long (Fig 4-108); the plan's
# printed lengths run 249 in from the firebox's front to the back platform's end, with a 13 in wall
# between the chambers, a front firebox 36 in (faint) long over a dug-out ash pit, and a second
# firebox grate 15 in long with a side door (Fig 4-110). The front ash pit is the walkway into the
# chamber; grate bars ¾ in apart; in the door's bricking a large 15 × 18 in opening, a 9 × 13½ in
# stoke hole and air holes at grate level (p.117); the second firebox's air through a 5 in clay
# tube under its grate (p.116). Chimney 15 × 24 in inside (Fig 4-110).
# The two chambers differ and are described on these pages, not the unbuilt two-chamber design's
# (the owner, 2026-11-18): the front Bizen-style, its 36 in firebox and 55 in ware platform under a
# tall dome; the back tube-style and lower, its 15 in second grate, 55 in platform, 9 in grate and
# 66 in back platform, falling and tapering into the chimney (Figs 4-108, 4-110, 4-111). The 8 ft
# spans the firebox, the first platform and the 13 in wall, 104 in; the 12 ft the 145 in behind it
# (the split at the side door). So the front chamber is entered 55 in deep, the engine laying its
# 36 in firebox in front of it, and the back 145 in. Measured (olsen-figure-scaling.md §7, §8):
# - the width, 53 in, on Fig 4-113's own bricks at the wall between the chambers (48–57½ in), as
#   the owner asked the heights be checked against a brick's 9 in face; Fig 4-108's "55"" falls in
#   it. The plan isn't drawn to one scale: 59–63½ in at its shelves, 72½–76½ in at its lengths;
# - the front chamber's springline, 42½ in, where the castable meets that wall (41–44½ in, Fig
#   4-113); the dome rises 2¾ in per foot of the span, 12 in (p.51), so 54½ in to its top, which
#   the photos put about 36–51 in over the stoke hole's sill (Figs 4-109, 4-112);
# - the back chamber's springline, 35 in, the castable over its side of the wall (34–36 in, Fig
#   4-114, if that photo shows the back face); its floor 5–11 in higher there; the same rise;
# - the three flues between the chambers about 12 in wide and 11 in tall (Figs 4-110, 4-113,
#   4-114), their sills 15½–18 in up.
# The owner (2026-11-18): the 15 × 18 in opening is an air inlet, with the grate-level air holes
# besides; the air inlets are in the doors; the side walls as drawn, 14–19 in. Entered:
# - the 15 × 18 in inlet as the front firebox's air, below the grate: Fig 4-112 draws a framed
#   opening about 13½ × 20½ in low in the door, its top 17–20 in under the stoke hole's sill (§8);
#   the grate-level air holes aren't sized, so they're left out (the least air);
# - the stoke holes covered after each stoking (the owner), so not air inlets;
# - the front firebox opening into the chamber through its whole mouth, as a Bizen-style front
#   chamber's does, not through an inlet flue (the 15 × 18 in was taken for one before);
# - its grate as the plan draws it, about 33 in long and 18 in across (16–19 in, Fig 4-110);
# - the second firebox's air through the 5 in tube, round (its shape isn't printed), below its
#   grate; the side door's air holes aren't sized;
# - the side walls 18 in (9 + 9 in), in the drawn 14–19 in; the floor 9 in, as before (not drawn);
# - the front firebox under the front dome, open into it, so as tall as its springline, 42½ in; its
#   ash pit the walkway, 12 in down to it from the chamber floor (the 12 in step, Figs 4-109,
#   4-110), with the grate level with the floor.
# Assumed: the castable is Kaolite 2600-LI, which Olsen lists (p.28) and which is probably his "K-26
# IFB castable", though no source confirms it (masonry-materials.md §5.3). The domes 6 in thick,
# "best" for most castings (p.59). Walls and floor of medium-duty firebrick (Olsen's intermediate
# duty, p.18), as the book gives no grade. The domes are buttressed: Olsen buttresses a cast dome's
# walls "extremely well" (p.59). The dug-out ash pit, walked through into the chamber, puts the
# floor on the ground.
# Not modelled:
# - the back chamber's fall and its taper into the chimney: full width to 111 in behind the wall,
#   then down to a 26–31 in throat (chamber.widths takes one chamber, not a row);
# - the floors' steps (12 in up from the ash pit into the first chamber, Fig 4-109; the 18 and
#   6 in, their direction not shown), so the back's floor is level with the front's;
# - the insulating-brick transition under the domes;
# - the flues' sills 15½–18 in up (the engine cuts them at the floor);
# - the second firebox's stoking door in the side wall (Fig 4-110 "DOOR", about 36 in long);
# - the round spy holes in the domes' sides (Fig 4-108, unsized).
# The chimney's 15 × 24 in section can't be entered without its height, which isn't printed, so the
# chimney isn't entered and the engine sizes it.
