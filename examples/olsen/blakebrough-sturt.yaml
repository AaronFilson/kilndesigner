# Les Blakebrough's kiln, Sturt Pottery, Mittagong, Australia (Olsen, The Kiln Book, 4th ed.,
# p.205, p.208): a wood-fired chamber kiln. Its first chamber has its own firebox, a channel
# along the chamber stoked through a hole in the side; an oil-drip system also fires it (p.208).
#
# From the book: "CHAMBER: 6' tall, 45" wide, 6' deep" (Fig 8-15). The drawing (re-read on the page
# image, 2026-11-08) puts the 45" across the arched front, side to side, and the 6' along the top,
# front to back: the arch spans the 45 in and runs back 6 ft. The text's "the entire width of the
# 6ft chamber" (p.205) uses "width" for that 6 ft. "FIREBOX: 12" tall, 9" wide, 6' deep" (Fig 8-15):
# a channel 9 in wide down the 6 ft, low against the side wall (drawing), with grate bars or long
# soaps wedged along the wall and floor on 9 in centres and the ash dropping to the channel's
# bottom (p.205); "INLET FLUES 9" × 4½"" from it into the chamber, "STOKE HOLE SIDE" in the side
# wall (Fig 8-15); a round spy hole high in the front, left of the crown (drawing).
# Assumed: one chamber, the first; the book doesn't say how many there are. The arch is drawn
# pointed, its curve running down to near the floor (drawing): entered as a catenary, 6 ft to the
# crown over the 45 in span (?). The firebox is in the right wall (the drawing's side, seen from the
# front), and its inlet flues are six (drawing, ?: about six slots show along the channel). The
# book names no brick: 9 in of 2600 °F insulating brick, Olsen's choice for a cone 10 wood kiln's
# hot face (p.25–26: his anagama's K-26 resisted wood-ash slag better than hard brick of the same
# rating), the thickness inside his 9–10 in for climbing kilns (p.99–100); the floor and arch the
# same (engine default). Cone 10, the hottest chambers of the Kyoto Suzuki kiln (suzuki-kyoto,
# Fig 4-35, p.93): the book gives no cone for this kiln. The channel's grate is the channel itself,
# 9 in × 6 ft. No chimney or exit flue is given, so the engine sizes them, and the steel that
# holds the arch: the book shows no buttress. The stoke hole's and spy hole's sizes aren't printed:
# engine default; one spy hole, placed by the engine.
# Not modelled: the other chambers and any main firebox; the oil-drip system, six drip channels
# (p.208), since a design here burns one fuel in its fireboxes. The floor's loss into dry soil is
# worked out at steady state.
schema: 1
name: Les Blakebrough's chamber kiln, Sturt Pottery
units: us
firing:
  cone: "10" # not given for this kiln: the Suzuki kiln's hottest chambers (p.93)
chamber:
  width: 45 in # "45" wide", across the arched front (Fig 8-15, drawing)
  depth: 6 ft # "6' deep" (Fig 8-15)
  height: 6 ft # "6' tall", to the crown (Fig 8-15)
  on_ground: true # the firebox is a channel low in the chamber (p.205)
roof:
  type: catenary_arch # drawn pointed, springing near the floor (Fig 8-15, ?)
loading:
  type: door
  face: front
  door: bricked
lining:
  walls:
    - material: ifb-k26 # brick not named: Olsen's wood-kiln hot face (p.26)
      thickness: 9 in
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1
        position: right # (drawing, ?) along the side wall, stoked from the side (Fig 8-15)
        width: 9 in # "9" wide" (Fig 8-15)
        length: 6 ft # "6' deep" (Fig 8-15)
        height: 12 in # "12" tall" (Fig 8-15)
        grate:
          width: 9 in
          length: 6 ft
        inlet:
          width: 9 in # "INLET FLUES 9" × 4½"" (Fig 8-15); which way is which isn't printed
          height: 4.5 in
        inlets: 6 # (drawing, ?)
spy_holes:
  count: 1 # one round hole drawn high in the front (Fig 8-15); its size isn't printed
draft:
  type: cross
  flue_wall: back
