# Kei Fujiwara's Bizen kiln, Imbe, Okayama (Olsen, The Kiln Book, 4th ed., p.98–105): a wood
# climbing kiln fired for exactly seven days: the fire mouth (dogi), a small "secret" chamber
# (himitsu), a first chamber and a second, lower one (kedo), then a 25 ft chimney.
#
# From the book: the dogi 8 ft long and 10 ft wide inside (Fig 4-53); its fire-mouth hole 3½ ×
# 2 ft when open (p.102); the first chamber 4 ft 6 in long and 5 ft tall, the kedo 2 ft 10 in long
# and 4 ft tall (Fig 4-53, Fig 4-55); a 5 in rise per 12 in, atan(5/12) = 22.6°, built up the
# slope, so the floor is on the ground (Fig 4-55, p.101); walls 10 to 13 in, tightly built,
# overcoated with fireclay, straw and earth (p.100); the kedo's exit flues into a stack that runs
# 3½ ft before rising into the round chimney, 25 ft tall (p.101, Fig 4-53).
# Each ware chamber its own size (chamber.sizes): 54 in long and 60 in to the crown, and 34 in
# long and 48 in to the crown.
# Assumed: the dogi is the firebox, fired on its floor. The chambers' width isn't printed (the
# plan marks the first chamber as the widest part, and the kedo narrower): the dogi's 10 ft. Each
# arch rises 6 in per foot of its span along the draft, the top of the 4–6 in Olsen uses on
# chamber kilns (p.296), a semicircle: 27 in and 17 in, so the springlines are at 33 in and 31 in.
# The depth, height and rise below are the first chamber's. Walls 11½ in, the middle of
# 10–13 in. The book names no brick: Japanese chamber kilns are built of local firebrick (bidai,
# p.94–95), so medium-duty firebrick (Olsen's intermediate duty, p.18); the floor as the walls
# (engine default). A 9 in arch, as the Bidai kiln (bidai, Fig 4-36). Cone 10, the hottest
# chambers of the Kyoto Suzuki kiln (suzuki-kyoto, Fig 4-35, p.93): the book gives no cone for
# this kiln (p.104: fire colour decides). The chimney's section isn't given, only its 10 in round
# entry (p.101), so the engine sizes it. The arches are held by masonry (buttressed): in chamber
# kilns each chamber's arch spans along the draft and throws its thrust onto the common wall and
# on to the chimney (p.95, p.97); the book shows no steel on this kiln.
# Not modelled: the dogi holds ware on three steps (p.102), and its own walls and roof aren't in
# the heat loss; the himitsu, a 2 ft chamber in a 24 in flue, and its 3 × 6 in and 6 × 9 in flues
# (p.100–101); the kedo's 6 × 10 in exit flues, whose count isn't given; the flue damper at the
# chimney's entrance (p.101–102, Fig 4-55); the doors into the chambers in the side wall, the
# takiguchi side fire holes and the spy holes (Fig 4-55: drawn, not sized or placed). Chambers in
# a row get arches along the draft, springing from the walls between them, as the book's do; held
# by masonry, they get no steel. The chimney is about 3 × the kiln's whole rise, the dogi's run included
# (p.101); here the rise is counted over the two chambers only. The floor's loss into dry soil is worked out at steady state.
schema: 1
name: Kei Fujiwara's Bizen kiln, Imbe
units: us
firing:
  cone: "10" # not given for this kiln: the Suzuki kiln's hottest chambers (p.93)
chamber:
  width: 10 ft # the dogi's width (Fig 4-53)
  depth: 54 in # the first chamber's, 4 ft 6 in
  height: 33 in # its springline: 60 in to the crown, less the rise
  chambers: 2
  sizes: # Figs 4-53, 4-55
    - depth: 54 in # 4 ft 6 in, 5 ft tall
    - depth: 34 in # the kedo, 2 ft 10 in, 4 ft tall
      height: 31 in # 48 in to the crown, less the rise
      rise: 17 in # 6 in per foot of the 34 in span (p.296)
  slope: 22.6 degree # 5 in rise per 12 in
  on_ground: true # built up the slope (p.101)
roof:
  type: sprung_arch
  rise: 27 in # 6 in per foot of the first chamber's 54 in span (p.296)
  buttressed: true # the common walls take each chamber's thrust (p.95, p.97)
loading:
  type: door
  face: front
  door: bricked
lining:
  walls:
    - material: firebrick-medium-duty-smithfield # brick not named
      thickness: 11.5 in # 10–13 in (p.100)
  roof:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in # as the Bidai kiln's arch
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1 # the dogi, the fire mouth
        position: front
        width: 10 ft
        length: 8 ft
        stoke_hole:
          width: 42 in # 3½ ft
          height: 24 in # 2 ft
draft:
  type: cross
  flue_wall: back
  run_to_chimney: 42 in # the flue stack, 3½ ft (p.101)
  chimney:
    height: 25 ft # p.101
