# Mansimran Singh's low-fire glaze kiln, New Delhi (Olsen, The Kiln Book, 4th ed., p.155–156): a
# round wood-fired updraft, "a Muslim design dating from antiquity", built by Singh's father for
# Delhi Blue tiles and low-fire glazed pottery. Shards and saggar pieces cover the setting.
#
# From the book: chamber 5 ft across inside (Fig 6-12, plan); the setting 5 ft high (Fig 6-12,
# section); the firebox 4 ft long under the domed floor, 2 ft 6 in from the floor dome down to
# the pit floor (Fig 6-12, checked on the page image, 2026-10-31); six rectangular inlet flues through the floor, one marked 4 × 4 in
# (Fig 6-12); wood, hardwood logs 2–6 in across, burned in the firebox and its coals shoved into a
# pit under the chamber (p.155); shards and saggar pieces piled over the setting for a roof.
# Assumed: the temperature isn't given. The owner's band (2026-11-17) is below 2100 °F (1149 °C),
# from 800 °C (1472 °F), the frit ware's lowest firing in the outside sources
# (11-17-26-inputs.md §4). The design takes the band's top, 2100 °F; v2's tests carry the band.
# It was 1760 °F, Falcone's usual top (p.160). The cover is the owner's estimate (2026-11-18):
# shards 3 in thick over 80 % of the top's width, the other 20 % open as the exhaust. The engine's
# open top doesn't take a cover yet. The firebox's width isn't printed
# legibly: 16½ in, scaled off the plan where it passes through the wall (Fig 6-12; step A,
# 2026-11-09, scratch/scale-pz/scale.py). All six inlet flues are taken as 4 × 4 in, like the one marked. The
# walls aren't described: 9 in, which Olsen says stands to 8 ft unsupported (p.41), of hard brick
# (his fast-fire wood kiln "can be built of IFB or hard brick", p.142); medium-duty
# firebrick (Olsen's intermediate duty, p.18). The floor is 9 in, as the floor of Singh's
# coal kiln (p.134). No door: none is drawn, and the kiln is set from the top (Fig 6-11), so
# loading.type is "top". The air: engine defaults.
# Not modelled: the central round flue, about 7 in across (scaled, ±½ in; its printed size is
# cut off at the page edge), as an under-floor firebox's inlets can't be placed one by one; the domed floor, taken as flat; the open top's loss (the engine leaves it out).
schema: 1
name: Singh's low-fire glaze kiln, New Delhi
units: us
firing:
  top_temperature: 2100 degF # the top of the owner's band, 800–1149 °C (2026-11-17)
chamber:
  shape: round
  width: 60 in
  depth: 60 in
  height: 60 in # the setting's height
roof:
  type: open # shards and saggar pieces over the setting: 3 in over 80 %, 20 % the exhaust (the owner)
loading:
  type: top # set over the walls, no door drawn (Fig 6-11)
lining:
  walls:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in
  floor:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in
heat:
  fire:
    fuel: wood
    fireboxes:
      - position: under
        width: 16.5 in # its mouth through the wall (scaled: Fig 6-12, p.156, plan, from the 5' diameter across and up the page, ±1 in); the half-legible "1?–15"" beside it (?)
        length: 48 in
        height: 30 in # from the floor dome down to the pit floor (Fig 6-12)
        inlet:
          width: 4 in
          height: 4 in
        inlets: 6
draft:
  type: up
