# Olsen's Bowen Mountain salt kiln, Col Levy's studio, Australia (Olsen, The Kiln Book, 4th ed.,
# p.127–128): a revised Chappell design, a cross-draft salt kiln with a firebox across the front
# behind a bag wall, exit flues into a collection box, and the chimney. It is drawn for gas, oil
# drip or wood (p.127); this file is the gas version, the one whose burners the book names.
#
# From the book: the chamber 5 ft long and 3 ft wide inside, 36 in from floor to crown; "9" WALLS"
# (Fig 4-153); for gas, "2 GAS BURNERS PER FLUE", "MR 750 BURNERS", each pair in an IFB block with
# two "2½" HOLES", four inlet flues drawn across the front wall of the plan (checked on the page
# image, 2026-10-31; an earlier reading had three); the chimney 13½ × 13½ in at the base,
# tapering to 9 × 9 in at the top, "CHIMNEY HEIGHT MIN 10' MAX 12'", behind a flue collection box
# 9 in wide (Fig 4-153); salting from cone 9–10 (p.128).
# The vault as built (Fig 4-153's long section, checked on the page image at 300 dpi, 2026-10-31):
# one arch spanning the 5 ft length, front to back, its ring as thick as the 9 in walls, springing
# from the back wall "18"" above the floor and from the front wall, where the drawing puts the
# "BRACING", at about the same height; the crown "36"" up, near the middle. So the chamber's
# section across its 3 ft width is a rectangle rising from 18 in at the end walls to 36 in
# mid-way, the side walls filled up to the arch (roof.along). The front springing reads about
# 16 in, a little under the back's 18 in (read by the user, 2026-10-31), so the arch springs
# unevenly (roof.front_springline): the circle through both springings, its crown 36 in up, a
# little behind the middle. The rise over the back's springline, 36 − 18 = 18 in, is 3.6 in per
# foot of the 5 ft span.
# As built (read by the user from the construction photos, Fig 4-154/4-155, 2026-10-31): a normal
# sprung arch laid on a form, its 9 in as two 4½ in rings, one laid on the other (roof.ring: 2,
# both layers the ring); angle steel on the kiln's corners with bars joining them above, tie rods
# over the arch, so the frame on the end walls holds the thrust and the rods run the 5 ft length
# (the engine sizes it); the kiln built into a concrete platform round its whole perimeter. The
# concrete's strength, 1800 psi, is the user's starting value, not a sourced one; the platform's
# height and how far it runs out past the walls aren't known.
# The user, 2026-10-31: the platform runs under the whole kiln and its firebox; the tie bars run
# about 1½ ft over the crown (roof.rods_above_crown); the posts' feet are in or bolted to the
# platform, not at the foundation's bottom, so no bottom ring: the engine takes them pinned.
# Assumed: eight burners, two in each of the four flues. Cone 10, the top of 9–10. The chimney
# 11 ft, the middle of 10–12 ft. The book names no brick: for
# salt Olsen says high-alumina brick is best (p.126), and Kähler's salt kiln used high-alumina
# insulating brick (p.136); JM 28 is 67 % alumina by Olsen's Table 1-4 (p.27), so ifb-jm28 for
# the walls, arch and floor. The gas is propane at 11 in. w.c. at the burners,
# with a high-pressure regulator at the tank (p.215, p.227); the book doesn't say which gas this
# kiln burned. The exit flues aren't counted, so the engine sizes the exit flue.
# The door: "24" (+-) DOOR" in the plan's lower side wall, the right wall looking from the
# firebox to the chimney, drawn about mid-length (Fig 4-153), so centred here. It is 36 in tall
# (read by the user, 2026-10-31), its head into the vault, which meets the side wall about
# 33.8 in up at its jambs: arched, as Olsen's doors are, its 9 in ring turned in the vault's edge.
# Not modelled: the firebox and bag wall, 12 in below the floor, the four salt holes and the
# salt itself.
schema: 1
name: Bowen Mountain salt kiln, gas
units: us
firing:
  cone: "10" # salting starts at cone 9–10 (p.128)
chamber:
  width: 3 ft
  depth: 5 ft
  height: 18 in # to the springline, at the back wall (Fig 4-153)
  foundation:
    material: concrete # under the whole kiln and its firebox (the user, 2026-10-31)
    compressive_strength: 1800 psi # below IRC Table R402.2's 2500-3500 psi
    strength_source: the user's starting value, 2026-10-31; not sourced
    # thickness: not known (not visible in the photos), so the floor's loss through it and its
    # top face's temperature aren't worked out
roof:
  type: sprung_arch
  along: true # the arch spans the 5 ft length, front to back (Fig 4-153)
  ring: 2 # two 4½ in rings (photos, read by the user)
  rise: 18 in # 36 in to the crown, less the 18 in springline
  front_springline: 16 in # about 16 in at the front (Fig 4-153, read by the user)
  rods_above_crown: 18 in # the tie bars about 1½ ft over the crown (the user, 2026-10-31)
  # The steel is for building: "there is probably no need for the steel after construction once
  # the brick is mortared" (the user, 2026-10-31). The kiln is mortared and built into its concrete
  # platform, so in service the masonry holds the arch; the frame is sized and listed to hold it
  # while the mortar sets. No source quantifies the mortar's or the platform's restraint.
  buttressed: true
  building_frame: true
loading:
  type: door
  face: right
  door: bricked
  opening:
    width: 24 in # "24" (+-) DOOR"
    height: 36 in # read by the user; its head rises into the vault's edge
lining:
  walls:
    - material: ifb-jm28 # brick not named: high-alumina for salt (p.126, p.136)
      thickness: 9 in
  # The floor: three courses of brick laid flat off the platform in the construction photo
  # (Fig 4-154, p.128); the plan drawing (Fig 4-153) shows the floor about 6 in thick against the
  # 9 in arch, so light-duty firebrick or insulating firebrick (the user, 2026-10-31). Taken as
  # three 2½ in courses of insulating firebrick, 7½ in; JM 28, the walls' brick, as a floor under
  # salt wants the same high-alumina brick (p.126). The drawing's ~6 in is a reading, not a size.
  floor:
    - material: ifb-jm28
      thickness: 2.5 in
    - material: ifb-jm28
      thickness: 2.5 in
    - material: ifb-jm28
      thickness: 2.5 in
  roof: # two 4½ in rings, one on the other (photos, read by the user)
    - material: ifb-jm28
      thickness: 4.5 in
    - material: ifb-jm28
      thickness: 4.5 in
heat:
  gas:
    fuel: propane
    burners:
      type: venturi
      model: GACO MR750
      count: 8 # two per flue, four flues (Fig 4-153)
      wall: front
      port:
        diameter: 2.5 in # the IFB block's "2½" HOLES"
    supply:
      type: line
      pressure: 11 inch_H2O # propane at the burners (p.215, p.227)
draft:
  type: cross
  flue_wall: back
  run_to_chimney: 9 in # the flue collection box
  chimney:
    height: 11 ft # 10–12 ft
    inside:
      width: 13.5 in
      depth: 13.5 in
    top:
      width: 9 in
      depth: 9 in
