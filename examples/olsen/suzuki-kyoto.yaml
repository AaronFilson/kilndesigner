# Suzuki cooperative kiln, Torincho Street, Kyoto (Olsen, The Kiln Book, 4th ed., p.93,
# Fig 4-35): a seven-chamber Kyoto wood climbing kiln, fired on bundles of wood to cone 8–9 in
# about 56 hours, chambers 1 and 2 to cone 10.
#
# From the book: seven chambers climbing the ground (p.93), so the floor is on the ground; each
# "14 x 6 1/2 x 4 1/2 ft (4.3 x 2 x 1.4m)" (p.93; the feet, lost in the gutter in the scan, read
# by the user), 4.3 m across, 2 m tall and 1.4 m deep, as the Kyoto chambers lie; cone 10 in chambers 1 and 2, the hottest
# (Fig 4-35); the firebox stoked 15 hours to 1000 °C, then each chamber from its sides (p.93).
# Assumed: the 2 m is to the crown. The arch rises 0.7 m: Olsen uses 4–6 in per foot of span on
# chamber kilns of 4–8 ft (p.296), and the top of that range on the 1.4 m span is nearest the
# tall pointed arches of the Kyoto kilns (Bidai's rise 21–27 in on 36–46 in, Fig 4-36). So the
# springline is at 1.3 m. The slope is the Bidai kiln's 3 to 1, 18.4° (bidai, Fig 4-36). Walls
# 9½ in, inside Olsen's 9–10 in for climbing kilns (p.99–100), and a 9 in arch, as the Bidai kiln.
# The book names no brick: Kyoto kilns are built of local firebrick of no stated grade (bidai,
# p.94–95), so medium-duty firebrick (Olsen's intermediate duty, p.18); the floor as the walls
# (engine default). The book doesn't size the firebox, so the fire is the chambers' own fireboxes
# (himae), the Kyoto kilns' 9 in trough along each chamber's front wall, stoked from both sides
# (kyoto-climbing, p.92, Fig 4-34). No chimney is given, so the engine sizes it. The arches are
# held by masonry (buttressed): each chamber's arch spans front to back and throws its thrust onto
# the common wall and on to the chimney, the front braced (p.95, p.97).
# Not modelled: the main firebox, stoked for the first 15 hours. The engine's arch spans the
# width, so it is laid across the 4.3 m with the same springline and crown; held by masonry, it
# gets no steel. The doors are in the side walls; a sprung arch here springs from the side
# walls, so the door is put in the front wall. The chambers' cones differ (7 is bisque, "Δ1");
# the kiln is worked out at the hottest, cone 10. The floor's loss into dry soil is worked out at steady state.
schema: 1
name: Suzuki cooperative climbing kiln, Kyoto
units: metric
firing:
  cone: "10" # chambers 1 and 2 (Fig 4-35)
chamber:
  width: 4.3 m
  depth: 1.4 m
  height: 1.3 m # to the springline: 2 m to the crown, less the rise
  chambers: 7
  slope: 18.4 degree # the Bidai kiln's 3 to 1
  on_ground: true # a climbing kiln (p.93)
roof:
  type: sprung_arch
  rise: 0.7 m # 6 in per foot of the 1.4 m span (p.296)
  buttressed: true # the common walls take each chamber's thrust (p.95, p.97)
loading:
  type: door
  face: front
  door: bricked
lining:
  walls:
    - material: firebrick-medium-duty-smithfield # local firebrick, grade not given
      thickness: 9.5 in
  roof:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in # as the Bidai kiln's arch
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 7 # one himae in each chamber
        position: front
        width: 9 in # the trough (p.92)
        length: 4.3 m # across the chamber
draft:
  type: cross
  flue_wall: back
