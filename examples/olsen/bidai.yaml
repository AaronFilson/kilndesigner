# Kyoto Bidai climbing kiln, 1962 (Olsen, The Kiln Book, 4th ed., p.94–97, p.200–201): a
# Kyoto-style wood climbing kiln, its foundation dug into a small slope: a firebox, three
# cross-draft chambers up a 3 to 1 slope, then the chimney.
#
# From the book: three chambers 73 in wide inside, 42, 46 and 36 in deep, and 59, 65 and 59 in
# from floor to crown (Fig 4-36); the front wall leans in to 38 in, where the arch begins
# (p.94–95); a 9 in arch; "3 TO 1 SLOPE" (Fig 4-36), atan(1/3) = 18.4°; bricks 6 × 3½ × 9½ in to
# 6 × 6 × 9½ in in thick fireclay joints (p.94–95); each arch's peak set back so its thrust goes
# onto the common wall and on to the chimney (p.95), so the arch is buttressed; the foundation dug
# into a small slope (p.94, p.97), so the floor is on the ground; the firebox 46 in long
# (Fig 4-36), six fireclay grate bars in a 14 in grate zone over a 14 in ash pit (Fig 8-7); the
# chimney right behind chamber 3 (Fig 4-36).
# Assumed: one chamber size for all three, their mean: 41⅓ in deep and 61 in to the crown, so the
# arch rises 23 in from the 38 in springline. The bricks have no stated grade:
# medium-duty firebrick (Olsen's intermediate duty, p.18). Walls 9½ in, one length of those
# bricks, inside Olsen's 9–10 in for climbing kilns (p.99–100); the floor as the walls (engine
# default). Cone 10, the hottest chambers of the Kyoto Suzuki kiln (suzuki-kyoto, Fig 4-35,
# p.93): the book gives no cone for this kiln. The firebox is taken as a box as wide as the
# chamber it feeds, 73 in. Its grate is the 14 in zone (read here as across the firebox) by 21 in,
# the middle of the 18–24 in bars of Kawaii's kiln, which has the same firebox (kawaii, p.97,
# p.200). No total chimney height is printed (p.94–95), so the engine sizes the chimney.
# The doors, one per chamber, 20 in wide, all in one side wall at each chamber's front, under the
# end of its arch (Fig 4-36's plan); their height isn't printed, so each is as tall as the engine
# lays a door in a side wall, to the springline, 38 in, and arched, as the doors of Olsen's other
# built kilns are (door-openings.md).
# Not modelled: each arch is peaked toward the back (p.91–92, p.95); the engine's is a circular
# arch from the front wall to the back. Also left out: the floor's loss into the ground (the engine doesn't work it out), the
# firebox's semicircular front, the 3 in overcoat of fireclay, dirt and straw (p.95), the vapour
# and spy holes, the steps between chambers, and the chimney's grid of 9 × 9 in flues across the
# 73 in width (Fig 4-36).
schema: 1
name: Kyoto Bidai climbing kiln, 1962
units: us
firing:
  cone: "10" # not given for this kiln: the Suzuki kiln's hottest chambers (p.93)
chamber:
  width: 73 in
  depth: 41.33 in # the mean of 42, 46 and 36 in
  height: 38 in # where the arch begins (p.94–95)
  chambers: 3
  slope: 18.4 degree # "3 TO 1": atan(1/3)
  on_ground: true # the foundation dug into a slope (p.94, p.97)
roof:
  type: sprung_arch
  rise: 23 in # to the mean crown, 61 in (59, 65, 59)
  buttressed: true # thrust onto the common walls and the chimney (p.95)
loading:
  type: door
  face: right # one side wall (Fig 4-36's plan)
  door: bricked
  opening:
    width: 20 in # "DOOR" 20" at each chamber (Fig 4-36)
    height: 38 in # not printed: to the springline, as tall as the engine lays a side door
    across: -10.5 in # at each chamber's front, against the wall between (Fig 4-36's plan)
    each_chamber: true # one per chamber, all in one side wall (Fig 4-36)
lining:
  walls:
    - material: firebrick-medium-duty-smithfield # local firebrick, grade not given
      thickness: 9.5 in
  roof:
    - material: firebrick-medium-duty-smithfield
      thickness: 9 in # "9"" arch (Fig 4-36)
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1
        position: front
        width: 73 in # not printed: the chamber it feeds
        length: 46 in # Fig 4-36
        grate:
          width: 14 in # the grate zone, six fireclay bars (Fig 8-7)
          length: 21 in # Kawaii's bars, 18–24 in (p.97)
        ash_pit: 14 in # Fig 8-7
draft:
  type: cross
  flue_wall: back
  run_to_chimney: 0 in # the chimney stands right behind chamber 3 (Fig 4-36)
