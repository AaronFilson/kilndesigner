# The author's kiln, first estimate (docs/planning/02-plan.md, "The first two users").
# A cone 10 cross-draft with a cast arch: elements for the slow early stages, then propane.
# 28 in wide inside with 8 in walls keeps the outside to 44 in, the site's limit.
schema: 1
name: PNW hybrid cross-draft, cone 10, bricked door
units: us
firing:
  cone: "10"
  # The setting (pnw-hybrid-crossdraft.md), weighed by the engine (furniture.py): four 12 × 24 ×
  # 1 in mullite shelves a layer (24 in across, 12 in along; 4 in in front, 1 in between and at the
  # back: Olsen p.142, p.151), weighed from Olsen's 20.5 lb shelf (p.33–35). Four layers is an
  # ASSUMPTION, not sourced or confirmed. No posts: no source gives a post's size or weight, so
  # they are left out. The ware weighs 7 times the setting, the middle of the author's 6 to 8.
  setting:
    shelves: {length: 24 in, width: 12 in, thickness: 1 in, material: mullite, per_layer: 4, layers: 4}
    ware_ratio: 7 # the author (the user, 2026-10-30): ware is 6 to 8 times the setting
chamber:
  width: 28 in
  depth: 60 in # along the draft, from the burners to the flue
  height: 44 in # to the arch's springline; the arch adds its rise
roof:
  type: sprung_arch
  rise: 3.75 in # a 60° arch: 0.134 × the span
loading:
  type: door
  face: front # an end wall: the arch springs from the sides
  opening: # the author's door (docs/kilns/pnw-hybrid-crossdraft.md, 2026-10-30)
    width: 24 in
    height: 40 in
    sill: 0 in # at floor level
    head: arch # an arched brick head, the author's choice
lining:
  walls:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: ifb-k23
      thickness: 2.5 in
    - material: kaowool-blanket-8pcf
      thickness: 1 in
  floor:
    - material: ifb-jm26
      thickness: 4.5 in
    - material: ifb-k23
      thickness: 2.5 in
  roof:
    - material: kast-o-lite-30-li-plus
      thickness: 3 in
    - material: kaowool-blanket-8pcf
      thickness: 2 in
shell:
  finish: painted
heat:
  electric:
    supply:
      voltage: 240 V
      phase: 1
      breaker: 60 A # 48 A continuous
    alloy: kanthal-apm
    walls: [left]
    # The hand-over at the start of shino reduction, cone 012–010 (about 1580–1680 °F, Orton,
    # cones.yaml): set by the glaze, not by the cheapest point on the cost chart
    off_above: 1650 degF
  gas:
    burners:
      type: venturi
      count: 8 # the author's: slow flame movement at high volume
      wall: front # through the bricked door, from a removable welded-steel rack
      places: # two columns of four up the sides of the 24 in door, every three courses from one
        # course up (Pitelka [S4]); each 4¼ in port 0.9 in in from its jamb and 3 in under the head
        - {wall: front, across: -9 in, up: 4.625 in}
        - {wall: front, across: -9 in, up: 12.125 in}
        - {wall: front, across: -9 in, up: 19.625 in}
        - {wall: front, across: -9 in, up: 27.125 in}
        - {wall: front, across: 9 in, up: 4.625 in}
        - {wall: front, across: 9 in, up: 12.125 in}
        - {wall: front, across: 9 in, up: 19.625 in}
        - {wall: front, across: 9 in, up: 27.125 in}
    supply:
      type: cylinders
      # The author's choice, more 100 lb cylinders: 11 meets the burners' draw at 20 °F even ¼
      # full keeping 10 psi (5 would do full, 8 half full)
      count: 11
    reduction: true
draft:
  type: cross
  flue_wall: back
site:
  ambient: 50 degF
  coldest_ambient: 20 degF
  electricity_price: 0.12 USD/kWh
  propane_price: 3.50 USD/gallon
  materials_budget: 5000 USD
