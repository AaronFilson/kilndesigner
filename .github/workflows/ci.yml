name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kilndesigner
          POSTGRES_PASSWORD: kilndesigner
          POSTGRES_DB: kilndesigner
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kilndesigner" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      # Set, so the database tests fail rather than skip if the services are missing
      KILNDESIGNER_TEST_DATABASE_URL: postgresql+asyncpg://kilndesigner:kilndesigner@localhost:5432/kilndesigner_test
      KILNDESIGNER_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python 3.14
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: The engine never imports a surface (ADR 0002)
        run: uv run lint-imports
      - name: Tests, with branch coverage (fails under 98%)
        run: uv run pytest --cov

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Types (the app, the client and the browser tests)
        run: npm run check
      - name: Unit tests, with line coverage (fails under 98%)
        run: npm run coverage --workspace @kilndesigner/web

  compose:
    # The self-hosted app as a user runs it: a design saved, built and fetched through the API,
    # then the same in a real browser (the runner's Google Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Start the self-hosted app
        run: docker compose up --detach --wait
      - name: Install
        run: uv sync --locked --python 3.14
      - name: Save, build and fetch a design through the web app
        run: uv run pytest -m compose
        env:
          KILNDESIGNER_COMPOSE_URL: http://localhost:8080
      - name: Install the browser tests
        run: npm ci
      - name: Browser tests
        run: npm run e2e
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Logs
        if: failure()
        run: docker compose logs
