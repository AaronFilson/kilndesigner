# The reference kilns: what Frederick L. Olsen, The Kiln Book, 4th ed., prints about each kiln it
# describes, for engine v2's heat and statics validation (docs/adr/0017-engine-v2.md).
# Every kiln was built and fired. Read from the page-cited notes (docs/research/olsen-kilns.md,
# kiln-reference.md), the kilns' docs (docs/kilns/olsen/) and design files (examples/olsen/),
# 2026-11-09; a few pages were checked on the scan, as each fact's note says.
#
# kilns: the 53 kilns with a design file. extras: kilns and worked examples with no design file
# (no chamber size printed, or a part only) that print a heat figure or a structural fact.
#
# Each kiln: name, design, doc, fuel, draft, then lists of facts in six groups (heat, chamber,
# lining, flow, structure, service), gaps (what the book doesn't give that a heat or statics check
# needs) and notes (disagreements between the notes, the doc and the design file).
#
# Each fact: what (a fixed vocabulary per group; core/tests/v2/test_reference_kilns.py), value (a
# number, [low, high], a string, or for a schedule ["H:MM", temperature] pairs as printed), unit
# (Pint, or a count word: bundle, shovel, piece, brick, stoking, firing, burner, chamber, shelf),
# bound ("<", "<=", ">", ">=", "~" about; default "="), status, page (the book's printed page),
# figure, and as needed spread, reason, reading (flagged | uncertain, as the notes mark it),
# condition, quote (a few words of the book), note, start (a schedule's first clock time), and
# firing (a label: heat facts with the same label describe one firing, so a time is compared only
# with the fuel or burners of the same firing; unlabelled facts form one firing).
#
# Statuses:
#   printed  a number in the text, or a dimension printed on a figure;
#   derived  arithmetic on printed numbers (reason: the arithmetic);
#   scaled   measured off a figure from a dimension printed on it (figure, spread);
#   drawing  read off a figure with no printed dimension and not scaled (figure);
#   assumed  not in the book: the design file's value and its reason, with the Olsen page of any
#            rule it follows. No value is here without a source.
schema: 1
book: Frederick L. Olsen, The Kiln Book, 4th ed.
kilns:
  anagama-hole:
    name: Anagama dug into a clay hill (type)
    design: examples/olsen/anagama-hole.yaml
    doc: docs/kilns/olsen/anagama-hole.md
    fuel: wood
    draft: cross
    heat:
      - what: cone
        value: "10"
        status: assumed
        reason: no temperature printed; cone 10 from the anagama-style kiln built at 
          Höhr-Grenzhausen in 2003 (hohr-2003, p.122); masonry-materials.md §4a.7 puts such a clay's
          ceiling near cone 10–11
    chamber:
      - what: width
        value: 5.25
        unit: foot
        status: printed
        page: p.84
        figure: Fig 4-5
      - what: crown_height
        value: 3.5
        unit: foot
        status: printed
        page: p.84
        figure: Fig 4-5
        reading: uncertain
        note: the chamber's height; the fraction is faint
      - what: length
        value: [9, 12]
        unit: foot
        status: printed
        page: p.84
        figure: Fig 4-5
      - what: length
        value: 10.5
        unit: foot
        status: assumed
        reason: the middle of the printed 9–12 ft
      - what: slope
        value: 25
        unit: degree
        status: printed
        page: p.84
        figure: Fig 4-5
        quote: slope angle 25
      - what: shape
        value: one sloping tube whose section is a rounded teardrop (dashed), tapering at the back 
          into a chimney flue up to the hill's surface
        status: drawing
        page: p.84
        figure: Fig 4-5
    lining:
      - what: wall
        value: ground clay bisque, the clay bank fired in place
        status: printed
        page: p.84
        figure: Fig 4-5
      - what: wall
        value: walls, roof and floor of fired clay, entered as Norton's porous fireclay brick
        status: assumed
        reason: unfired clay has no conductivity data above room temperature; masonry-materials.md 
          §4a finds a fired clay face conducts like a porous fireclay brick; §4a.6 shows one firing 
          fires only about the inner 5 cm, so a wall fired all through is a simplification
      - what: wall_thickness
        value: 9
        unit: inch
        status: assumed
        reason: the 9–10 in of Olsen's climbing kilns' walls (pp.99–100)
    flow:
      - what: firebox
        value: entrance and firebox 2 × 2 ft, one opening drawn
        status: printed
        page: p.84
        figure: Fig 4-5
        quote: "ENTRANCE & FIREBOX 2' X 2'"
        note: the design takes 2 × 2 ft as the firebox's width, length and height and as its mouth
      - what: stoke_hole
        value: [15, 23]
        unit: inch
        status: scaled
        page: p.84
        figure: Fig 4-5
        spread: ±20 % (4.4–6.7 px/in from the printed 3½', 5¼' and 9–12')
        condition: the entrance's width, drawn as an oval
      - what: stoke_hole
        value: [29, 45]
        unit: inch
        status: scaled
        page: p.84
        figure: Fig 4-5
        spread: ±20 % (4.4–6.7 px/in from the printed 3½', 5¼' and 9–12')
        condition: the entrance's height, drawn as an oval
        note: taller than the printed 2 ft by more than the spread; the design keeps the printed 2 ×
          2 ft
      - what: chimney_section
        value: [4.5, 7]
        unit: inch
        status: scaled
        page: p.84
        figure: Fig 4-5
        spread: 4½–7 in, one side in the page's gutter
        condition: the flue's width; its depth isn't drawn
        note: a vertical flue up the back to the hill's surface, drawn with a width arrow and no 
          number; not entered in the design (engine-sized chimney)
    structure:
      - what: roof_type
        value: the cavity's own roof, a rounded teardrop section dug and fired in the clay bank
        status: drawing
        page: p.84
        figure: Fig 4-5
      - what: roof_type
        value: a half-circle arch on the 5¼ ft width, springing 10½ in up and crowning at 3½ ft
        status: assumed
        reason: the tube's roof taken as a groundhog's half-cylinder (p.112)
      - what: span
        value: 63
        unit: inch
        status: derived
        page: p.84
        figure: Fig 4-5
        reason: the printed 5¼ ft inside width
      - what: rise
        value: 31.5
        unit: inch
        status: assumed
        reason: a half-circle on the 63 in width (p.112)
      - what: springline_height
        value: 10.5
        unit: inch
        status: assumed
        reason: the printed 3½ ft crown less the half-circle's 31½ in rise
      - what: earth_backing
        value: dug into a clay bank; the hill surrounds the walls and roof and the floor is the 
          ground
        status: printed
        page: pp.83–84
      - what: construction
        value: a cavity dug into a clay bank, widened, then tapered back into a chimney flue to the 
          surface; firebox, floor and walls shaped in the clay and bisqued into a monolith by a fire
          of rising intensity kept up for weeks
        status: printed
        page: pp.83–84
    service:
      - what: use
        value: a type, the original anagama; the photos (Figs 4-3, 4-4A, 4-4B) name no place
        status: printed
        page: p.84
    gaps:
      - chimney height and section (the flue's width is drawn without a number)
      - exit flue
      - the fired thickness of the clay walls and roof
      - temperature or cone
      - firing time
      - fuel per firing
    notes:
      - the entrance scales 15–23 in wide and 29–45 in tall against the printed 2 × 2 ft (step A); 
        taller than printed by more than the ±20 % spread
      - the design counts the walls and roof as losing heat to air through 9 in of fired clay, not 
        into the hill, so its 105 kW loss at the top is high (the kiln doc says so)

