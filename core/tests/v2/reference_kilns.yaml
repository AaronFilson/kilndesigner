  olsen-crossdraft-36:
    name: Olsen's 36 cu ft dense cross-draft
    design: examples/olsen/olsen-crossdraft-36.yaml
    doc: docs/kilns/olsen/olsen-crossdraft-36.md
    fuel: gas
    draft: cross
    heat:
      - what: firing_time
        value: [12, 15]
        unit: hour
        status: printed
        page: p.226
        note: about 12–15 h to temperature; the cone isn't printed
      - what: burner_count
        value: 6
        status: printed
        page: p.226
      - what: burner_type
        value: small venturi air-mixer burners
        status: printed
        page: p.226
      - what: burner_rating
        value: 36000
        unit: BTU/hr
        status: printed
        page: p.226
      - what: burner_input
        value: 216000
        unit: BTU/hr
        status: derived
        page: p.226
        reason: 6 × 36,000 BTU/hr
      - what: input_per_volume
        value: 6000
        unit: BTU/ft**3/hr
        status: derived
        page: p.226
        reason: 216,000 BTU/hr ÷ 36 cu ft; under his own 16,000 minimum for dense brick
      - what: gas
        value: natural gas on an 8 in. w.c. line
        status: assumed
        reason: the meter's normal pressure (p.227); the book doesn't name the gas
      - what: cone
        value: "10"
        status: assumed
        reason: Rule 1 and its dense-brick figure are for Olsen's high fire (p.226)
    chamber:
      - what: volume
        value: 36
        unit: ft**3
        status: printed
        page: p.226
        note: whether interior or stacking isn't said
      - what: width
        value: 39.6
        unit: inch
        status: assumed
        reason: a cube of 36 cu ft (Principle 1, pp.74–75)
      - what: depth
        value: 39.6
        unit: inch
        status: assumed
        reason: a cube of 36 cu ft
      - what: springline_height
        value: 39.6
        unit: inch
        status: assumed
        reason: a cube of 36 cu ft
    lining:
      - what: wall
        value: dense brick
        status: printed
        page: p.226
      - what: wall
        value: 4½ in of medium-duty firebrick backed by 4½ in of K-23 IFB, walls, roof and floor 
          alike
        status: assumed
        reason: bare dense brick can't reach cone 10 on this input (about 208,000 BTU/hr lost 
          through 9 in of bare super-duty brick against about 63,000 kept); Olsen backs his hot 
          faces (p.176; Fig 2-32, p.52)
      - what: wall_thickness
        value: 9
        unit: inch
        status: assumed
        reason: his least for a wall over 3 ft high (p.41)
    structure:
      - what: roof_type
        value: sprung arch
        status: assumed
        reason: as his Bowen Mountain cross-draft has (p.127)
      - what: span
        value: 39.6
        unit: inch
        status: assumed
        reason: the assumed chamber width
      - what: rise
        value: 4.96
        unit: inch
        status: assumed
        reason: 1½ in per foot of span on a featheredge skewback, his commonest arch for small kilns
          (p.25, p.51)
      - what: ring_thickness
        value: 4.5
        unit: inch
        status: assumed
        reason: the dense hot face, the K-23 laid over it
    service:
      - what: builder
        value: Olsen, who fired it
        status: printed
        page: p.226
      - what: use
        value: his evidence that most gas kilns are completely overpowered
        status: printed
        page: p.226
    gaps:
      - dimensions and the wall's construction (was the dense brick backed?)
      - gas, pressure and the cone reached
      - roof, ports, flues, chimney
      - ware load
    notes:
      - the design file's backing of the dense brick is the engine's inference from the heat 
        balance, not the book's; the firing time depends strongly on it

