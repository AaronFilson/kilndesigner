  kyoto-climbing:
    name: Kyoto-style climbing chamber kiln (type)
    design: examples/olsen/kyoto-climbing.yaml
    doc: docs/kilns/olsen/kyoto-climbing.md
    fuel: wood
    draft: climbing
    heat:
      - what: cone
        value: "10"
        status: assumed
        reason: not given for the type; the Suzuki kiln's hottest chambers (Fig 4-35, p.93)
      - what: fuel_kind
        value: wood
        status: printed
        page: pp.89–94
      - what: fuel_rate
        value: >-
          stoked from both sides at once, the floor zones hana, tsunaka and donaka reached by the length
          of the toss; for reduction stoke at quick intervals with the coals stacked high in the
          firebox, for oxidation let each stoking burn down; in middle-to-oxidation firing stoke before
          the coals burn out completely or the temperature won't rise
        status: printed
        page: pp.92–94
        figure: Fig 4-33
      - what: atmosphere
        value: >-
          reduction chambers have a double-radius arch with its peak toward the back, which congests the
          flow and helps reduction; middle-fire and oxidation chambers a nearly single-radius arch
        status: printed
        page: pp.91–92
        figure: Fig 4-32
      - what: evenness
        value: >-
          taller, narrower chambers (the Kyoto 4 ft wide by 6 ft tall) spread heat better and give more
          control of the atmosphere; chambers about as wide as they are tall (other climbing kilns,
          6 by 6 ft) run more oxidizing and reduce less easily
        status: printed
        page: pp.91–92
        figure: Fig 4-31
      - what: setting
        value: >-
          the upper half (nibon) is the main stacking, also fired by the takaguchi stoke hole; the lower
          half (ne) is fired through a stoke hole between the saggar settings; with saggar settings and
          no sunken firebox, channel bricks along the floor 9 in apart and a space at least 9 in wide
          between the setting and the front wall, the full height of the stacking
        status: printed
        page: p.93, p.205
    chamber:
      - what: height
        value: [6, 7]
        unit: foot
        status: printed
        page: p.91
        figure: Fig 4-28
        quote: "Kyoto climbing kiln dimensions: 6–7' tall, 4.5–6' wide"
      - what: width
        value: [4.5, 6]
        unit: foot
        status: printed
        page: p.91
        figure: Fig 4-28
      - what: width
        value: 4
        unit: foot
        status: printed
        page: pp.91–92
        figure: Fig 4-31
        condition: Fig 4-31's Kyoto chamber, 6 ft tall, pointed arch, against other climbing kilns 
          at 6 ft wide by 6 ft tall
      - what: width
        value: 63
        unit: inch
        status: assumed
        reason: the middle of the printed 4½–6 ft (Fig 4-28)
      - what: crown_height
        value: 78
        unit: inch
        status: assumed
        reason: the middle of the printed 6–7 ft (Fig 4-28)
      - what: depth
        value: 41.33
        unit: inch
        status: assumed
        reason: not given for the type; the mean of the Bidai kiln's chambers (Fig 4-36, p.94)
      - what: springline_height
        value: 57.3
        unit: inch
        status: assumed
        reason: 78 in to the crown less the assumed 20.7 in rise
      - what: chamber_count
        value: 10
        status: assumed
        reason: as the Kyomizu kiln Olsen fired for 2½ years (Fig 4-27)
      - what: slope
        value: 18.4
        unit: degree
        status: assumed
        reason: the Bidai kiln's 3 to 1 (Fig 4-36)
    lining:
      - what: wall
        value: medium-duty firebrick (firebrick-medium-duty-smithfield)
        status: assumed
        reason: local firebrick with thick fireclay joints and no stated grade (bidai, pp.94–95), so
          Olsen's intermediate duty (p.18)
      - what: wall_thickness
        value: 9.5
        unit: inch
        status: assumed
        reason: inside Olsen's 9–10 in for climbing kilns (pp.99–100)
      - what: roof_thickness
        value: 9
        unit: inch
        status: assumed
        reason: as the Bidai kiln's arch (Fig 4-36)
    flow:
      - what: firebox
        value: >-
          a chamber firebox (himae) in each chamber, a 9 in trough next to the front wall with one row
          of
          empty saggars as the bag wall, stoked through the takaguchi
        status: printed
        page: p.92
        figure: Fig 4-34
      - what: between_flues
        value: outlet about 9 × 5 in, 9 in apart; inlet 9 × 6 to 9 × 4½ in; a mark 18 in inside the 
          chamber at the outlet flue, meaning unclear
        status: printed
        page: p.91
        figure: Fig 4-28
        quote: approx. 9 x 5" spaced 9" apart
      - what: between_flues
        value: outlets drawn 11 in tall and 5½ in wide, inlets 9½ in tall, so 9 in is the height and
          5 in the width across
        status: scaled
        page: p.91
        figure: Fig 4-28
        spread: ±1 in tall, ±½ in wide, from the printed 15 in floor to outlet
        note: the 15 in and the printed chamber ranges don't agree in scale (by the 15 in the 
          chamber is drawn 35 in wide and 49 in tall); the 15 in agrees with the flue sizes, so it 
          was used for the flues only
      - what: between_flues
        value: standard 4½ × 9 in flues spaced 9 in apart can be used instead
        status: printed
        page: p.96
      - what: between_flues
        value: five 5 × 9 in flues a wall
        status: assumed
        reason: the count isn't printed; as many 5 in flues as fit across the assumed 63 in, 9 in 
          apart (Olsen's rule, p.96)
    structure:
      - what: roof_type
        value: pointed arch (Kyoto chamber); reduction chambers a double-radius arch, its peak set 
          toward the back; middle-fire and oxidation chambers nearly single-radius
        status: printed
        page: pp.91–92
        figure: Figs 4-31, 4-32
      - what: roof_type
        value: >-
          reduction chamber's arch peak 58 % (56–60 %) of the span from the front wall; rise 0.68 of the
          span; radii about 0.59 (front) and 0.47 (back) of the span
        status: drawing
        page: p.92
        figure: Fig 4-32
        note: ratios measured off the figure in step A (±2 %); it prints no dimension; not entered 
          in the design file (the back half turns past a quarter circle)
      - what: span
        value: 41.33
        unit: inch
        status: assumed
        reason: each arch spans its chamber along the draft (p.95, p.97); the depth is the Bidai 
          kiln's mean
      - what: rise
        value: 20.7
        unit: inch
        status: assumed
