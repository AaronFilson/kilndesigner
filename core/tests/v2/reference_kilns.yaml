          2026-11-08); the width isn't given elsewhere
      - what: depth
        value: 6
        unit: foot
        status: printed
        page: p.107
        figure: Fig 4-67
        note: the 6' arrow runs from the front of the floor to the back wall
      - what: crown_height
        value: 4.5
        unit: foot
        status: printed
        page: p.107
        figure: Fig 4-67
        reading: uncertain
        condition: to the tallest point
      - what: slope
        value: 20
        unit: percent
        status: printed
        page: p.108
        reading: flagged
        quote: A 20% slope was used
        note: standard for most kilns of this style; 20 % is about 11.3°
      - what: slope
        value: 20
        unit: degree
        status: printed
        page: p.107
        figure: Fig 4-67
        reading: flagged
        quote: 20° SLOPE
        note: 20° is about 36 %
      - what: slope
        value: 11.3
        unit: degree
        status: assumed
        reason: the text's 20 % (p.108) followed, atan 0.2
      - what: shape
        value: bricked up in a teardrop form butting into the back wall
        status: printed
        page: p.107
    lining:
      - what: wall
        value: walls, arch and floor of K-26 insulating brick
        status: assumed
        reason: K-26 on the hot face of Olsen's anagama resisted wood-ash slag better than hard 
          brick (p.26)
      - what: wall_thickness
        value: 9
        unit: inch
        status: assumed
        reason: the 9–10 in of Olsen's climbing kilns' walls (pp.99–100)
    flow:
      - what: firebox
        value: a combustion area of about 4 ft at the front, with no grates
        status: printed
        page: p.107
        figure: Fig 4-67
        reading: uncertain
        quote: NO GRATES
      - what: firebox
        value: an 18 in step up from the combustion area, then the chamber floor slopes up
        status: printed
        page: p.108
      - what: exit_flue
        value: two, 4½ × 9 in (11.5 × 23 cm), in the back wall
        status: printed
        page: p.108
      - what: chimney_count
        value: 2
        status: drawing
        page: p.107
        figure: Fig 4-67
        note: two dashed stacks; whether two chimneys or one split into two flues isn't printed
      - what: chimney_height
        value: 8
        unit: foot
        status: printed
        page: p.107
        figure: Fig 4-67
        condition: to the ground line
      - what: damper
        value: a damper on top of the chimney
        status: printed
        page: p.107
        figure: Fig 4-67
        quote: DAMPER ON TOP
      - what: stoke_hole
        value: a round-headed firebox mouth, taller than wide; no size printed
        status: drawing
        page: p.107
        figure: Fig 4-69
    structure:
      - what: roof_type
        value: one continuous shell over an elongated oval or teardrop plan, the walls curving 
          straight into it with no visible springing line
        status: drawing
        page: p.107
        figure: Fig 4-67
        note: read on the page image (curved-kilns.md); no section across the tube is drawn
      - what: roof_type
        value: a half-circle on the 4 ft width, springing 30 in up and crowning at 4½ ft
        status: assumed
        reason: as a groundhog's half-cylinder (p.112), to the printed 4½ ft (faint) crown
      - what: span
        value: 48
        unit: inch
        status: derived
        page: p.107
        figure: Fig 4-67
        reason: the printed 4 ft width
      - what: rise
        value: 24
        unit: inch
        status: assumed
        reason: half the 4 ft width (a half-circle)
      - what: springline_height
        value: 30
        unit: inch
        status: assumed
        reason: the 4½ ft crown less the 24 in rise
      - what: buttress
        value: held without steel (buttressed)
        status: assumed
        reason: the book's tube kilns are dug into a bank or the ground (pp.83–85, p.112), and a 
          battered wall carries an arch without steel (p.53)
      - what: construction
        value: bricked up in a teardrop form with a bricklaying technique whose name is unreadable, 
          butting into the back wall
        status: printed
        page: pp.107–108
        figure: Fig 4-74
        reading: uncertain
    service:
      - what: builder
        value: Mr Bae, a third-generation Onggi potter, for an NCECA conference (year not printed)
        status: printed
        page: p.107
    gaps:
      - what makes up the 16 ft base beyond the 4 ft combustion area and 6 ft chamber
      - wall and shell thickness
      - chimney section
      - cone or temperature
      - firing time
      - wood per firing
      - the firebox door's size
    notes:
      - the slope is printed both as 20 % (text, p.108) and 20° (Fig 4-67); the design uses 20 % 
        (11.3°)
      - 4 ft of combustion area and 6 ft of chamber make 10 ft against the printed 16 ft base (kiln 
        doc question 1)
      - the design's chimney height is measured from the floor at the firing end, so its top is 
        understated by the floor's rise, about 32 in

