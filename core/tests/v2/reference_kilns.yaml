        figure: Fig 4-78
        reason: the printed widths at the bag wall and at the widest
      - what: buttress
        value: held by masonry (buttressed), no steel
        status: assumed
        reason: early large kilns carried their roofs on walls 18 in to 5 ft thick with no 
          reinforcing (p.45); a battered wall carries an arch without steel (p.53)
    service:
      - what: condition
        value: two chimneys added since the kilns' rebirth help the overall firing
        status: printed
        page: p.110
