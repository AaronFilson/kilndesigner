[project]
name = "kilndesigner"
version = "0.1.0"
description = "Design kilns: geometry, heat loss, elements, burners and plans from one design file."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aaron Filson" }]
requires-python = ">=3.14"
keywords = ["kiln", "ceramics", "pottery", "heat transfer", "cad"]
dependencies = [
    "pydantic>=2.12",
    "pint>=0.25",
    "numpy>=2.3",
    "scipy>=1.16",
    "pyyaml>=6.0",
    "build123d>=0.10",
    "typst>=0.13",
    "cantera>=3.2",
    "xlsxwriter>=3.2",
    # Firing simulation results: Parquet files, queried with DuckDB (ADR 0007)
    "pyarrow>=21",
    "duckdb>=1.4",
    # Steel frames, rods and posts for engine v2's statics (the user, 2026-11-10)
    "pynitefea>=3.2.1",
    # Engine v2's heat model (the user, 2026-11-10; thermal-combinations.md, build order):
    # Monte Carlo view factors (trimesh + embreex), the firing as a DAE on SUNDIALS IDA
    # (scikit-sundae), the ground in 2-D (scikit-fem), the gas path (fluids) and convection (ht)
    "trimesh>=5.2.0",
    "embreex>=4.4.0.post1",
    "scikit-sundae>=1.2.0",
    "scikit-fem>=12.0.2",
    "fluids>=1.3.1",
    "ht>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
