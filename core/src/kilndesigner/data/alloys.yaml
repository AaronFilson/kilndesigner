# Resistance-wire alloys for elements, from the Kanthal data sheets.
# Every value traces to docs/research/electric-and-thermal.md §1.1, §1.2 and §1.4.
# ct: the temperature factor, R_T = Ct · R20 (Ct = 1.00 at 20 °C by definition).

- id: kanthal-a1
  name: Kanthal A-1
  resistivity_20c: 1.45 ohm*mm**2/m
  density: 7.10 g/cm**3
  max_temperature_air: 1400 degC
  max_temperature_endothermic_gas: 1050 degC
  ct: [[20, 1.00], [100, 1.00], [200, 1.00], [300, 1.00], [400, 1.00], [500, 1.01], [600, 1.02],
       [700, 1.02], [800, 1.03], [900, 1.03], [1000, 1.04], [1100, 1.04], [1200, 1.04],
       [1300, 1.04], [1400, 1.05]]
  source: "electric-and-thermal.md §1.1, §1.2, §1.4: Kanthal A-1 data sheet [S1], atmospheres [S9]"

