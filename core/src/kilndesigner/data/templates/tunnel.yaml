# Tamba tube kilns, Tachikui, Japan (Olsen, The Kiln Book, 4th ed., p.85–88, p.210, Figs 4-6 to
# 4-20A): 23 climbing tube kilns built by Korean potters in the Kamakura period, "an anagama
# extended to approximately 120 ft", half above ground. A firebox (dogi) is stoked for about 36
# hours, then the tube is side-stoked chamber by chamber. Few of its sizes are printed: most of
# this design is assumed, as said below.
#
# From the book: about 120 ft (36.5 m) long (p.85; Fig 4-7 prints 120–150, flagged), in 6–8 door
# segments (Fig 4-7), each taken as a chamber, 7 used; firebox 6 ft deep and 5 ft across at the
# entrance flues (p.86); four arched firebox flues 9 × 18 in (Fig 4-13), taken as 9 in wide and
# 18 in high; the first chamber 3½ ft (faint) tall (Fig 4-16), used as the tube's height to the
# crown. The end chamber has open "chimney" holes and no stack (Figs 4-18, 4-19).
# Scaled (step A, 2026-11-09, scratch/scale-pz/scale.py): the tube 78 in wide inside (Fig 4-12,
# ±6 in), wider than the firebox's printed 5 ft; the flues between chambers (Fig 4-12); the side
# stoke holes (Fig 4-16). The tube's crown is kept at the printed 3½ ft, though Fig 4-12 scales
# 35–41 in (?). Assumed: the vault springs 12 in up and rises 30 in to that crown.
# Walls, arch and floor 9 in of K-26 insulating brick: on the hot face of Olsen's anagama it
# resisted wood-ash slag better than hard brick (p.26), at the 9–10 in of his climbing kilns' walls
# (p.99–100). The arch is buttressed and the floor is on the ground: the kilns are built half
# above ground, so half below it (p.85). No temperature is printed (the first stoke holes reach
# about 1832 °F before side stoking, p.86): cone 10, from the anagama-style kiln built at
# Höhr-Grenzhausen in 2003 (hohr-2003, p.122).
# Not modelled: the slope, which isn't printed, so the tube is level; the side doors (arched,
# bricked up for each firing), as the engine's door in the front wall: their size in Fig 4-15
# (p.87) is washed out at the gutter, read 3′ (?) high and 2′ (?) wide with the rest of each
# figure lost (checked on the page image at 800 dpi, 2026-10-30), and they rise through the
# springing of the tube's vault, which is turned as an arch over each (Fig 4-11). The engine
# lays such a door out and checks it (a door in the side of a buttressed tube: the vault's ring
# over it, half the vault's weight on it, its thrust into the supporting wall), but with no
# legible size none is put in this file (flagged for the user; Fig 4-15's own faint 3′ and 2′
# are its only dimensions, so it can't be scaled). The end chamber's open holes
# are the only chimney: with no stack entered, the engine sizes one by Rule 5. The oil burners
# most of the kilns now fire their fireboxes with (p.86, p.210). The floor's loss into dry soil is worked out at steady state.
schema: 1
name: Tamba tube kiln, Tachikui
units: us
firing:
  cone: "10"
chamber:
  width: 78 in # (scaled: Fig 4-12, p.86, from the flue holes' printed 12" and 20"/24", ±6 in)
  depth: 205.7 in # 120 ft ÷ 7
  height: 12 in # to the springline; the vault crowns at 3½ ft
  chambers: 7
  on_ground: true # half above ground (p.85)
roof:
  type: sprung_arch
  rise: 30 in
  buttressed: true
  tube: true # one vault over the whole tube, "an anagama extended" (p.85)
lining:
  walls:
    - material: ifb-k26
      thickness: 9 in
heat:
  fire:
    fuel: wood
    fireboxes:
      - count: 1
        position: front
        width: 5 ft
        length: 6 ft
        inlet:
          width: 9 in
          height: 18 in
        inlets: 4
draft:
  type: cross
  flue_wall: back
  between: # four arched holes in each wall between chambers (Fig 4-12, p.86): the outer two
    # labelled "20 x 12"", the inner two "24 x 12"", drawn 12 in wide and 20 and 24 in high
    # (scaled: they're the taller holes in the middle, under the vault). One size per wall is
    # all the schema takes: 12 × 22 in, the same total area (derived: 2 × 240 + 2 × 288 =
    # 4 × 264 in²)
    count: 4
    port:
      width: 12 in
      height: 22 in
stoke_holes: # round side stoke holes (Figs 4-7, 4-10, 4-15), about 7 in across with their
  # centres about 32 in above the floor (scaled: Fig 4-16, p.87, from 3½' and 6', ±½ in): one
  # each side of each chamber; Fig 4-7 puts them 1½' apart, how many to a chamber isn't drawn
  - { chamber: 1, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 1, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 2, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 2, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 3, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 3, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 4, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 4, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 5, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 5, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 6, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 6, wall: right, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 7, wall: left, up: 32 in, port: { diameter: 7 in } }
  - { chamber: 7, wall: right, up: 32 in, port: { diameter: 7 in } }
