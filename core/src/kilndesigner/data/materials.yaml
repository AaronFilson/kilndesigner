- id: fireclay-brick-porous-norton
  name: Porous fireclay brick, 26.7 % porosity (Norton), as clay fired in place
  kind: dense_firebrick
  # The fired face of raw fireclay-and-sand walls conducts as a porous fireclay brick, between the
  # low- and medium-duty grades (masonry-materials.md §4a). Norton prints no density: 1900 kg/m³
  # is derived from the porosity and the solid density the makers' sheets imply (§4a.3). No
  # source rates such a body: max_service is left out (Lincoln 60 bloats at cone 11, §4a.1).
  density: 1900 kg/m**3
  max_service: null
  conductivity:
    unit: BTU*in/(hr*ft**2*degF)
    temperature_unit: degF
    points: [[400, 7.0], [800, 7.8], [1200, 8.7], [1600, 9.3], [2000, 10.2], [2400, 10.5]]
  source: "masonry-materials.md §4a.3, Norton, Refractories (1942), Table 76, p.553 [M27]"
  status: verified

- id: building-brick-common
  name: Common clay building brick (red brick)
  kind: building_brick
  # Olsen's weight for common brick, 100 lb/ft³ (4th ed. p.295); ASHRAE gives about 0.7 W/(m·K) at
  # this density, as Lienhard's figure here (masonry-materials.md §1.1). No maker or standard rates
  # building brick for kiln heat: max_service is left out.
  density: 1600 kg/m**3
  max_service: null
  conductivity:
    unit: W/(m*K)
    temperature_unit: degC
    points: [[0, 0.7], [1000, 0.7]]
  source: "masonry-materials.md §1.1, Lienhard, A Heat Transfer Textbook, 6th ed., Table A.2 [M1]"
  status: verified

- id: granite
  name: Granite (rubble or fieldstone)
  kind: stone
  density: 2640 kg/m**3
  max_service: null
  conductivity:
    unit: W/(m*K)
    temperature_unit: degC
    # Seipold's mean curve for measured granites, fitted for 250–1000 K, evaluated here
    points: [[0, 3.30], [100, 2.82], [200, 2.50], [300, 2.28], [400, 2.15], [500, 2.08],
             [600, 2.09], [700, 2.16]]
  source: "masonry-materials.md §3.1, Seipold, GFZ Potsdam STR01/13 (2001), p.92 [M14]"
  status: derived

