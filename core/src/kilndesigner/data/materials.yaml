# The materials library: refractories and insulation, with cited data.
#
# Every value traces to a file in docs/research/ (section and source tag given).
# "status" is how the value was read: "verified" from the source page, "excerpt" from a
# search-engine extract of a data sheet PDF that could not be opened (check before relying on it),
# or "derived" by arithmetic on a source (a published equation evaluated at these points).
#
# conductivity: thermal conductivity k at the stated mean temperature (ASTM C182 / C201 / C417).
# The engine uses these points as k(T), interpolated linearly, as ASTM C680 does with k(T) data.
# max_service: the classification or use-limit temperature the maker states.

