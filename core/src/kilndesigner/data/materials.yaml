# The materials library: refractories and insulation, with cited data.
#
# Every value traces to docs/research/electric-and-thermal.md (section and source tag given).
# "status" is how the value was read: "verified" from the source page, or "excerpt" from a
# search-engine extract of a data sheet PDF that could not be opened (check before relying on it).
#
# conductivity: thermal conductivity k at the stated mean temperature (ASTM C182 / C201 / C417).
# The engine uses these points as k(T), interpolated linearly, as ASTM C680 does with k(T) data.
# max_service: the classification or use-limit temperature the maker states.

- id: ifb-jm23
  name: Morgan Thermal Ceramics JM 23 insulating firebrick
  kind: insulating_firebrick
  density: 480 kg/m**3
  max_service: 1260 degC
  conductivity:
    unit: W/(m*K)
    temperature_unit: degC
    points: [[400, 0.12], [600, 0.14], [800, 0.17], [1000, 0.19]]
  source: "electric-and-thermal.md §4.1, Morgan JM data sheet 06:2011 [S29]"
  status: excerpt

