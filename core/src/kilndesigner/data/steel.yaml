# Steel for the kiln frame. Every table traces to docs/research/kiln-hardware.md.

# Equal-leg angles, AISC Shapes Database v16.0 (§4.7.1 [S28]). Leg and thickness in inches,
# weight lb/ft, Sx: elastic section modulus about a geometric axis (bending parallel to a leg),
# in³. Listed lightest first.
angles:
  source: "AISC Shapes Database v16.0; kiln-hardware.md §4.7.1 [S28]"
  shapes:
    - {name: "L2×2×3/16", leg: 2, t: 0.1875, w: 2.44, sx: 0.188}
    - {name: "L2×2×1/4", leg: 2, t: 0.25, w: 3.19, sx: 0.244}
    - {name: "L3×3×3/16", leg: 3, t: 0.1875, w: 3.71, sx: 0.433}
    - {name: "L2½×2½×1/4", leg: 2.5, t: 0.25, w: 4.10, sx: 0.387}
    - {name: "L2×2×3/8", leg: 2, t: 0.375, w: 4.70, sx: 0.348}
    - {name: "L3×3×1/4", leg: 3, t: 0.25, w: 4.90, sx: 0.569}
    - {name: "L3×3×5/16", leg: 3, t: 0.3125, w: 6.10, sx: 0.699}
    - {name: "L4×4×1/4", leg: 4, t: 0.25, w: 6.60, sx: 1.03}
    - {name: "L3×3×3/8", leg: 3, t: 0.375, w: 7.20, sx: 0.825}
    - {name: "L4×4×5/16", leg: 4, t: 0.3125, w: 8.20, sx: 1.27}
    - {name: "L4×4×3/8", leg: 4, t: 0.375, w: 9.80, sx: 1.50}

# Threaded rod, UNC: tensile stress area 0.7854 (D − 0.9743/n)² in² (Fastenal, §4.7.3 [S29]).
rods:
  source: "Fastenal thread table; kiln-hardware.md §4.7.3 [S29]"
  sizes:
    - {name: "3/8-16", d: 0.375, stress_area: 0.0775}
    - {name: "1/2-13", d: 0.5, stress_area: 0.1419}
    - {name: "5/8-11", d: 0.625, stress_area: 0.226}
    - {name: "3/4-10", d: 0.75, stress_area: 0.334}

# "many furnace designers limit tensile stress to 12,000 pounds per square inch", because the
# binding may run hot (HarbisonWalker, §4.3 [S20]).
binding_stress_psi: 12000
binding_stress_source: "HarbisonWalker Brick Installation Guide; kiln-hardware.md §4.3 [S20]"

# HarbisonWalker arch constants by rise per foot of span d (in/ft) (§4.3 [S20]):
# W = w_factor × D S T per foot of arch length; cold horizontal thrust H = h_factor × W.
# frame.cold_thrust_factor computes h_factor from statics; this column is kept as its check.
arch_constants:
  source: "HarbisonWalker Brick Installation Guide, arch tables; kiln-hardware.md §4.3 [S20]"
  d: [1, 1.25, 1.5, 1.608, 1.75, 2, 2.25, 2.302, 2.5, 2.75, 3]
  h_factor: [1.49, 1.18, 0.98, 0.91, 0.83, 0.72, 0.64, 0.62, 0.57, 0.51, 0.46]

# Maximum thrust of a heated arch free to rise, as a multiple of the cold H, by arch thickness
# as a share of span (rows, %) and d (columns). null is "stress excessive" (§4.3 [S20]).
heated_factor:
  t_over_s: [4, 5, 6, 7, 8, 9, 10]
  rows:
    - [1.88, 1.61, 1.47, 1.43, 1.39, 1.33, 1.29, 1.28, 1.26, 1.24, 1.22]
    - [2.41, 1.86, 1.63, 1.59, 1.52, 1.43, 1.38, 1.37, 1.33, 1.29, 1.26]
    - [3.29, 2.29, 1.94, 1.79, 1.67, 1.56, 1.47, 1.46, 1.42, 1.37, 1.33]
    - [5.0, 2.80, 2.14, 1.98, 1.93, 1.69, 1.58, 1.57, 1.51, 1.45, 1.41]
    - [null, 3.73, 2.55, 2.31, 2.17, 1.86, 1.70, 1.69, 1.60, 1.53, 1.48]
    - [null, 5.34, 3.06, 2.75, 2.41, 2.04, 1.84, 1.81, 1.72, 1.63, 1.57]
    - [null, null, 3.88, 3.30, 2.77, 2.22, 2.00, 1.95, 1.82, 1.73, 1.63]
