# Gas kiln reference data. Every table traces to docs/research/combustion-and-masonry.md.

# Ward Burner Systems Data Guide: BTU per cubic foot of kiln per hour (§3.1, [S28]).
# The high end of each range gives about a 6–7 hour firing; the low end about 14–18 hours.
ward_btu_per_ft3_hr:
  source: "Ward Burner Systems Data Guide; combustion-and-masonry.md §3.1 [S28]"
  columns: ["06", "6", "10"]
  walls:
    hard_brick: [[12000, 17000], [14000, 18500], [16000, 20000]]
    insulating_brick: [[6000, 10000], [8000, 13000], [10000, 16000]]
    ceramic_fibre: [[4000, 6000], [6000, 8000], [7000, 10000]]

